name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
      merge_prs_v2rayng:
        description: 'Comma-separated PR numbers to merge into V2rayNG app (0 = none)'
        required: false
        default: '0'
      clear_path:
        description: 'make dhr60 clear path (0 = none)'
        required: false
        default: '0'
      fetch_branches_from_other_v2:
        description: 'Enter v2 "username/repo branch" to fetch & merge, or 0 for none'
        required: false
        default: '0'
      hevtun_commit_id:
        description: "指定HevTun使用commit id版本"
        required: true
        default: "HEAD~0"
        type: string
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        repository: 2dust/v2rayNG
        ref: master
        submodules: 'recursive'
        fetch-depth: '0'


    
    - name: Apply commit from DHR60/V2rayNG self_use_build
      run: |
        cd ${{ github.workspace }}/V2rayNG
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        #git remote add DHR60 https://github.com/DHR60/V2rayNG.git
        #echo "Pref dnshost"
        #git fetch DHR60 self_use_build
        #git cherry-pick 6ce76ce4b3665ac60cb1fab42620c85afc1e66ff || true

        git remote add DHR60 https://github.com/DHR60/V2rayNG.git
        git fetch DHR60 self_use_build

        DNS_HOST_SHA=$(git log DHR60/self_use_build --grep="perf. dns host" --format="%H" -n 1)

        if [ -n "$DNS_HOST_SHA" ]; then
         echo "Found commit: $DNS_HOST_SHA"
         git cherry-pick $DNS_HOST_SHA || true
        else
        echo "Error: No commit found with message 'perf. dns host'"
        fi

        PARALLEL=$(git log DHR60/self_use_build --grep="Add DNS Parallel Query support" --format="%H" -n 1)

        if [ -n "$" ]; then
         echo "Found commit: $PARALLEL"
         git cherry-pick $PARALLEL || true
        else
        echo "Error: No commit found with message 'Add DNS Parallel Query support'"
        fi
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
          swap-size-gb: 10
    
    
    - name: Boostrap Gradle Memory
      shell: bash
      run: |
       wget https://raw.githubusercontent.com/PaulWoitaschek/Voice/refs/heads/main/scripts/gradle_bootstrap.sh
       chmod +x gradle_bootstrap.sh
       bash gradle_bootstrap.sh
      

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.2.0
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '13114758'
        packages: 'platforms;android-36.1 build-tools;36.1.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;28.2.13676358"
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "28.2.13676358"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: specify hevtun version
      run: |
          cd ${{ github.workspace }}/hev-socks5-tunnel
          git fetch --all
          git pull origin main
          git checkout --force --quiet ${{ inputs.hevtun_commit_id }}
          git submodule update --init --recursive

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh
    
    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.12
      with:
        repository: 't-e-s-tweb/AndroidLibXLite'
        tag: v26.4.25
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/


  
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      
    - name: Merge selected PRs into V2rayNG
      if: ${{ github.event.inputs.merge_prs_v2rayng != '0' }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        IFS=',' read -ra PR_LIST <<< "${{ github.event.inputs.merge_prs_v2rayng }}"
        for PR_NUM in "${PR_LIST[@]}"; do
          echo "Fetching PR #$PR_NUM from 2dust/v2rayNG..."
          git fetch origin pull/$PR_NUM/head:pr-$PR_NUM
          echo "Merging PR #$PR_NUM with auto-resolve (theirs)..."
          git merge -X theirs --no-edit pr-$PR_NUM || true
          echo "Changes from PR #$PR_NUM:"
          git log HEAD~1..HEAD --stat || true
        done

    - name: Merge selected Branch into V2rayNG
      if: ${{ github.event.inputs.fetch_branches_from_other_v2 != '0' }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Merge branch from another repo if requested
        if [ "${{ github.event.inputs.fetch_branches_from_other_v2 }}" != "0" ]; then
         BRANCH_INPUT="${{ github.event.inputs.fetch_branches_from_other_v2 }}"
        fi
        if [[ "$BRANCH_INPUT" != "0" ]]; then
        IFS=',' read -ra EXT_LIST <<< "$BRANCH_INPUT"
         for ITEM in "${EXT_LIST[@]}"; do
         REPO=$(echo "$ITEM" | awk '{print $1}')
         BRANCH=$(echo "$ITEM" | awk '{print $2}')

        echo "Fetching branch '$BRANCH' from repo '$REPO'..."

        # Name remote based on repo to avoid collision
        REMOTE_NAME="ext_$(echo "$REPO" | sed 's|/|_|g')"

        git remote add "$REMOTE_NAME" "https://github.com/$REPO.git" || true
        git fetch "$REMOTE_NAME" "$BRANCH"

        echo "Merging $REMOTE_NAME/$BRANCH (auto-resolve theirs)..."
        git merge -X theirs --no-edit "$REMOTE_NAME/$BRANCH" || true

        git add -A
        echo "Changes from $REMOTE_NAME/$BRANCH:"
        git log HEAD~1..HEAD --stat || true

        done
        fi 
    - name: patches
      run: |  
        wget https://raw.githubusercontent.com/t-e-s-tweb/v-rules/refs/heads/main/vpatches/unified.py
        python3 unified.py
        #wget https://raw.githubusercontent.com/t-e-s-tweb/v-rules/refs/heads/main/vpatches/unified1.py
        #python3 unified1.py
        #wget https://raw.githubusercontent.com/t-e-s-tweb/v-rules/refs/heads/main/vpatches/apply-patch2.py
        #ython3 apply-patch2.py
        #wget https://raw.githubusercontent.com/t-e-s-tweb/v-rules/refs/heads/main/vpatches/apply-patch3.py
        #python3 apply-patch3.py

    - name: Update VPN_MTU in AppConfig.kt
      run: |
       #sed -i 's/const val VPN_MTU = 1500/const val VPN_MTU = 8500/' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/AppConfig.kt
       sed -i -E 's/(address = "fakedns"),/\1/; s/domains = geositeCn\.plus\(proxyDomain\)\.plus\(directDomain\)//' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreConfigManager.kt
       #sed -i -E 's/([[:space:]]*tag = AppConfig\.TAG_DNS)/\1,\n    serveStale = true,\n    serveExpiredTTL = 0,\n    enableParallelQuery = false,\n disableFallbackIfMatch = true/' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/handler/V2rayConfigManager.kt
       #sed -i -E 's/([[:space:]]*tag = AppConfig\.TAG_DNS)/\1,\n    disableFallbackIfMatch = true/' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreConfigManager.kt
       #sed -i -E '/data class DnsBean\(/,/^\s*\)/ s/(\s*val tag: String\? = null)/\1,\n    val serveStale: Boolean? = null,\n    val serveExpiredTTL: Int? = null,\n    val enableParallelQuery: Boolean? = null,\n val disableFallbackIfMatch: Boolean? = null/' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/dto/V2rayConfig.kt
       #sed -i -E '/data class DnsBean\(/,/^\s*\)/ s/(\s*val tag: String\? = null)/\1,\n    val disableFallbackIfMatch: Boolean? = null/' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/dto/V2rayConfig.kt
       #sed -i -E '/skipFallback = true,/{:a;N;/tag = AppConfig\.TAG_DOMESTIC_DNS/ {s/(tag = AppConfig\.TAG_DOMESTIC_DNS)/queryStrategy = UseSystem,\n    \1/}; ba}' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/handler/V2rayConfigManager.kt
       #sed -i -E \
       #'/skipFallback = true,/{
       #N
       #s/(tag = AppConfig\.TAG_DOMESTIC_DNS)/queryStrategy = "UseIPv4",\n    \1/
       #}' \
       #${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/core/CoreConfigManager.kt
       #sed -i -E \
       #'/data class ServersBean\(/,/^\s*\)/ s/(val skipFallback: Boolean\? = null,)/\1\n            val queryStrategy: String? = null,/' \
       #${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/dto/V2rayConfig.kt
   # - name: test tun
   #   run: | 
#         sed -i '/"protocol": "tun"/,/}/ {
     #    /"settings": {/,/}/ {
    #     /}/a\
   #      ,\
  #       "sniffing": {\
   #      "enabled": true,\
   #      "routeOnly": true,\
    #     "destOverride": ["http", "tls"]\
   #      }
   #      }
    #     }' ${{ github.workspace }}/V2rayNG/app/src/main/assets/v2ray_config_with_tun.json

    - name: Refactor package name
      if: ${{ github.event.inputs.clear_path != '0' }}
      run: |
        wget https://raw.githubusercontent.com/t-e-s-tweb/rules/refs/heads/master/scripts/refactor_package.py
        python3 refactor_package.py    
    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        
        ./gradlew assembleRelease --no-daemon -PABI_FILTERS=arm64-v8a -Pandroid.injected.resConfigs=en,en_PK,en-pk -x check $(./gradlew tasks --all --quiet 2>/dev/null | awk '/lint|analyze|test|Test/{gsub(/.*:/,""); print "-x " $1}' | tr '\n' ' ')

    
    

    - name: Upload to release
      uses: svenstaro/upload-release-action@v2
      if: github.event.inputs.release_tag != ''
      with:
        file: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk
        tag: ${{ github.event.inputs.release_tag }}
        file_glob: true
        prerelease: true
        overwrite: true
