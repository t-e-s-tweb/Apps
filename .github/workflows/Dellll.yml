name: Build v2 strat

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild libv2ray even if cache exists?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      merge_prs:
        description: 'Comma-separated PR numbers to merge (e.g., "1,2,3" or "0" for none)'
        required: false
        default: ''
        type: string
        
      fetch_branches_from_other:
        description: 'Enter "username/repo branch" to fetch & merge, or 0 for none'
        required: false
        default: '0'

      merge_prs_v2rayng:
        description: 'Comma-separated PR numbers to merge into V2rayNG app (0 = none)'
        required: false
        default: '0'

      fetch_branches_from_other_v2:
        description: 'Enter v2 "username/repo branch" to fetch & merge, or 0 for none'
        required: false
        default: '0'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ABI_FILTERS: arm64-v8a
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: 2dust/v2rayNG
        ref: master
        submodules: 'recursive'
        fetch-depth: '0'
    - name: Enable Gradle caching
      run: |
          echo "org.gradle.caching=true" >> ${{ github.workspace }}/V2rayNG/gradle.properties
          echo "org.gradle.configuration-cache=true" >> ${{ github.workspace }}/V2rayNG/gradle.properties
          echo "org.gradle.configureondemand=true" >> /home/runner/work/Apps/Apps/V2rayNG/gradle.properties
          echo "org.gradle.configuration-cache.encryption=false" >> ${{ github.workspace }}/V2rayNG/gradle.properties
    
    #- name: optimize
      #run: |
           #wget https://raw.githubusercontent.com/t-e-s-tweb/v-rules/refs/heads/main/script.sh
           #chmod +x script.sh
           #./script.sh
    - name: Apply commit from DHR60/V2rayNG self_use_build
      run: |
        cd ${{ github.workspace }}/V2rayNG
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git remote add DHR60 https://github.com/DHR60/V2rayNG.git
        echo "Pref dnshost"
        git fetch DHR60 self_use_build
        git cherry-pick 00e3d41ebda802efa71c1b7e6dade34ff57cbaae || true
        #echo "Force Close core"
        #git cherry-pick de53c9af23c028167a4618471f1e34f50004957e || true

      #  git remote add kk599 https://github.com/kk599/V2rayNG.git
     #   git fetch kk599 master
     #   git cherry-pick 1b4907591d8961e212c4a283066f08f08c9ee200 || true
        
    - name: Merge selected PRs into V2rayNG
      if: ${{ github.event.inputs.merge_prs_v2rayng != '0' }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        IFS=',' read -ra PR_LIST <<< "${{ github.event.inputs.merge_prs_v2rayng }}"
        for PR_NUM in "${PR_LIST[@]}"; do
          echo "Fetching PR #$PR_NUM from 2dust/v2rayNG..."
          git fetch origin pull/$PR_NUM/head:pr-$PR_NUM
          echo "Merging PR #$PR_NUM with auto-resolve (theirs)..."
          git merge -X theirs --no-edit pr-$PR_NUM || true
          echo "Changes from PR #$PR_NUM:"
          git log HEAD~1..HEAD --stat || true
        done

    - name: Merge selected Branch into V2rayNG
      if: ${{ github.event.inputs.fetch_branches_from_other_v2 != '0' }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Merge branch from another repo if requested
        if [ "${{ github.event.inputs.fetch_branches_from_other_v2 }}" != "0" ]; then
         BRANCH_INPUT="${{ github.event.inputs.fetch_branches_from_other_v2 }}"
        fi
        if [[ "$BRANCH_INPUT" != "0" ]]; then
        IFS=',' read -ra EXT_LIST <<< "$BRANCH_INPUT"
         for ITEM in "${EXT_LIST[@]}"; do
         REPO=$(echo "$ITEM" | awk '{print $1}')
         BRANCH=$(echo "$ITEM" | awk '{print $2}')

        echo "Fetching branch '$BRANCH' from repo '$REPO'..."

        # Name remote based on repo to avoid collision
        REMOTE_NAME="ext_$(echo "$REPO" | sed 's|/|_|g')"

        git remote add "$REMOTE_NAME" "https://github.com/$REPO.git" || true
        git fetch "$REMOTE_NAME" "$BRANCH"

        echo "Merging $REMOTE_NAME/$BRANCH (auto-resolve theirs)..."
        git merge -X theirs --no-edit "$REMOTE_NAME/$BRANCH" || true

        git add -A
        echo "Changes from $REMOTE_NAME/$BRANCH:"
        git log HEAD~1..HEAD --stat || true

        done
        fi  
    - name: Prepare build dir
      run: |
        mkdir ${{ github.workspace }}/build
        
    - name: Prepare Go cache directories
      run: |
       mkdir -p ~/.cache/go-build
       mkdir -p ~/go/pkg/mod
       mkdir -p ~/.gomobile
       mkdir -p ~/go/bin
       
    - name: specify hevtun version
      run: |
          cd ${{ github.workspace }}/hev-socks5-tunnel
          git fetch --all
          git pull origin main
          git checkout --force --quiet 4682d7983c600dc702f33759f0250c96f54a0f2c
          git submodule update --init --recursive
          #git reset --hard origin/$(git rev-parse --abbrev-ref HEAD)
          #git checkout main
          #git pull
    - name: Fetch AndroidLibXrayLite
      if: inputs.force_build == 'true'
      run: |
        cd ${{ github.workspace }}/build
        git clone --depth=1 -b main https://github.com/DHR60/AndroidLibXrayLite.git
        cd AndroidLibXrayLite
        git submodule update --init
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '12266719'
        packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;28.2.13676358"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
        echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "28.2.13676358"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts
 
    - name: Restore cached libtun2socks
      id: cache-libtun2socks-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libtun2socks-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('.git/modules/badvpn/HEAD') }}-${{ hashFiles('.git/modules/libancillary/HEAD') }}-${{ hashFiles('compile-tun2socks.sh') }}--${{ hashFiles('compile-hevtun.sh') }}
   
    - name: Build libtun2socks
      if: steps.cache-libtun2socks-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-tun2socks.sh && bash compile-hevtun.sh

    - name: Save libtun2socks
      if: steps.cache-libtun2socks-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/libs
        key: libtun2socks-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('.git/modules/badvpn/HEAD') }}-${{ hashFiles('.git/modules/libancillary/HEAD') }}-${{ hashFiles('compile-tun2socks.sh') }}--${{ hashFiles('compile-hevtun.sh') }}
   
    - name: Copy libtun2socks
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app


    
   
    - name: Restore cached libv2ray
      id: cache-libv2ray-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/build/AndroidLibXrayLite/
        key: libv2ray-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          libv2ray-${{ runner.os }}-


    - name: Setup Golang
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false
        
    - name: Restore Go build, modules, gomobile, and Go tools cache
      if: inputs.force_build == 'true'
      id: cache-go-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ~/.gomobile
          ~/go/bin
        key: ${{ runner.os }}-go-gomobile-xx
        restore-keys: |
          ${{ runner.os }}-go-gomobile-xx

      
      

    
    - name: Install gomobile
      if: inputs.force_build == 'true'
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:~/go/bin
        

    - name: Build libv2ray
      if: inputs.force_build == 'true'
      run: |
        set -e  # Stop on error
        cd ${{ github.workspace }}/build/AndroidLibXrayLite
          
        echo "Preparing Go environment..."
        go env -w GOPRIVATE=github.com/xtls/xray-core
        go env -w GONOSUMDB=github.com/xtls/xray-core

        echo "Finding Go module cache path..."
        MODCACHE=$(go env GOMODCACHE)
        echo "Module cache path: $MODCACHE"

        echo "Ensuring xray-core is a full git clone..."
        XRAY_PATH="$MODCACHE/github.com/xtls/xray-core"
        rm -rf "$XRAY_PATH"  # Remove any proxy-downloaded copy
        git clone https://github.com/xtls/xray-core.git "$XRAY_PATH"
        cd "$XRAY_PATH"
        git checkout main

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        COUNT=${{ github.event.inputs.pr_count }}
        IFS=',' read -ra PR_LIST <<< "${{ github.event.inputs.merge_prs }}"
          for PR_NUM in "${PR_LIST[@]}"; do
            echo "Fetching PR #$PR_NUM..."
            git fetch origin pull/$PR_NUM/head:pr-$PR_NUM
            echo "Merging PR #$PR_NUM (auto-resolve: theirs)..."
            git merge -X theirs --no-edit pr-$PR_NUM || true
            echo "Changes from PR #$PR_NUM:"
            git log HEAD~1..HEAD --stat || true
          done

        # Merge branch from another repo if requested
        if [ "${{ github.event.inputs.fetch_branches_from_other }}" != "0" ]; then
         BRANCH_INPUT="${{ github.event.inputs.fetch_branches_from_other }}"
        fi
        if [[ "$BRANCH_INPUT" != "0" ]]; then
        IFS=',' read -ra EXT_LIST <<< "$BRANCH_INPUT"
         for ITEM in "${EXT_LIST[@]}"; do
         REPO=$(echo "$ITEM" | awk '{print $1}')
         BRANCH=$(echo "$ITEM" | awk '{print $2}')

        echo "Fetching branch '$BRANCH' from repo '$REPO'..."

        # Name remote based on repo to avoid collision
        REMOTE_NAME="ext_$(echo "$REPO" | sed 's|/|_|g')"

        git remote add "$REMOTE_NAME" "https://github.com/$REPO.git" || true
        git fetch "$REMOTE_NAME" "$BRANCH"

        echo "Merging $REMOTE_NAME/$BRANCH (auto-resolve theirs)..."
        git merge -X theirs --no-edit "$REMOTE_NAME/$BRANCH" || true

        git add -A
        echo "Changes from $REMOTE_NAME/$BRANCH:"
        git log HEAD~1..HEAD --stat || true

        done
        fi          
        
        
        
        cd ${{ github.workspace }}/build/AndroidLibXrayLite

        echo "Updating go.mod to use local xray-core..."
        go mod edit -replace=github.com/xtls/xray-core="$XRAY_PATH"
        go mod edit -replace=gvisor.dev/gvisor=gvisor.dev/gvisor@v0.0.0-20250606001031-fa4c4dd86b43

        go mod download
        go mod tidy
       

        echo "Initializing gomobile..."
        gomobile init -v

        
        echo "Binding for Android..."
        GOEXPERIMENT=greenteagc gomobile bind -v -androidapi 21 -trimpath -gcflags="all=-l=4" -ldflags='-s -w -buildid=' ./
   #   env:
   #     ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
   
  

    # Save Go-related caches after build/init
    - name: Save Go build, modules, gomobile, and Go tools cache
      if: inputs.force_build == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
          ~/.gomobile
          ~/go/bin
        key: ${{ runner.os }}-go-gomobile-xx

    
    
    
    - name: Save libv2ray
      if: inputs.force_build == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/build/AndroidLibXrayLite/
        key: libv2ray-${{ runner.os }}-${{ github.run_id }}


    - name: Copy libv2ray
      run: |
        cp -r ${{ github.workspace }}/build/AndroidLibXrayLite/*.aar ${{ github.workspace }}/V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
   
      
    - name: Restore cached libhysteria2
      id: cache-libhysteria2-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/hysteria/libs
        key: libhysteria2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hysteria/HEAD') }}-${{ hashFiles('libhysteria2.sh') }}
        
    - name: Build libhysteria2
      if: steps.cache-libhysteria2-restore.outputs.cache-hit != 'true'
      run: |
        bash libhysteria2.sh

    - name: Save libhysteria2
      if: steps.cache-libhysteria2-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/hysteria/libs
        key: libhysteria2-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hysteria/HEAD') }}-${{ hashFiles('libhysteria2.sh') }}

    - name: Copy libhysteria2
      run: |
        cp -r ${{ github.workspace }}/hysteria/libs ${{ github.workspace }}/V2rayNG/app

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: false
        cache-overwrite-existing: true
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    
    - name: Update VPN_MTU in AppConfig.kt
      run: |
       #sed -i 's/const val VPN_MTU = 1500/const val VPN_MTU = 8500/' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/AppConfig.kt
       sed -i -E 's/(address = "fakedns"),/\1/; s/domains = geositeCn\.plus\(proxyDomain\)\.plus\(directDomain\)//' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/handler/V2rayConfigManager.kt
       sed -i -E 's/([[:space:]]*tag = AppConfig\.TAG_DNS)/\1,\n    serveStale = true,\n    serveExpiredTTL = 0,\n    enableParallelQuery = false/' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/handler/V2rayConfigManager.kt
       sed -i -E '/data class DnsBean\(/,/^\s*\)/ s/(\s*val tag: String\? = null)/\1,\n    val serveStale: Boolean? = null,\n    val serveExpiredTTL: Int? = null,\n    val enableParallelQuery: Boolean? = null/' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/dto/V2rayConfig.kt
       #sed -i -E '/skipFallback = true,/{:a;N;/tag = AppConfig\.TAG_DOMESTIC_DNS/ {s/(tag = AppConfig\.TAG_DOMESTIC_DNS)/queryStrategy = UseIPv4,\n    \1/}; ba}' ${{ github.workspace }}/V2rayNG/app/src/main/java/com/v2ray/ang/handler/V2rayConfigManager.kt
       
    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleRelease --build-cache --configuration-cache -PABI_FILTERS="${ABI_FILTERS}"






    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@2.7.0
      with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*.apk
          tag: v2
          overwrite: true
          file_glob: true
