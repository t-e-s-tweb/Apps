name: optimizer

on:
  workflow_dispatch:
  push:
    branches: [ new ]
  pull_request:
    branches: [ new ]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          repository: TheXPerienceProject/android_packages_apps_XPerienceOptimizer
          ref: xpe-20.0
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
    
         # sed -i 's/8\.0/7.5/g' gradle/wrapper/gradle-wrapper.properties
        #  sed -i 's/8\.1\.4/7.4.2/g' build.gradle
     # - name: Fetch Pull Request Branch
       # run: git fetch https://github.com/Neamar/KISS.git +refs/pull/2285/merge
     # - name: Merge Commits
      #  run: |
          # Merge specific commits from the pull request
        #  git merge FETCH_HEAD --strategy-option=theirs --allow-unrelated-histories
     # - name: Fetch Pull Request Branch
     #   run: git fetch https://github.com/Neamar/KISS.git +refs/pull/2251/merge
    #  - name: Merge Commits
      #  run: |
          # Merge specific commits from the pull request
      #    git merge FETCH_HEAD --allow-unrelated-histories
    #  - name: Fetch Pull Request Branch
    #    run: git fetch https://github.com/Neamar/KISS.git +refs/pull/2252/merge
    #  - name: Merge Commits
     #   run: |
          # Merge specific commits from the pull request
       #   git merge FETCH_HEAD --allow-unrelated-histories
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4    
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

     
      
      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

    #  - name: Upload APK
    #    uses: actions/upload-artifact@v4
    #    with:
     #     name: KISS
       #   path: app/build/outputs/apk/release/*.apk
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@2.7.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/release/*.apk
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
      
