name: Heliboard

on:
  workflow_dispatch:
  push:
    branches: [ new ]
  pull_request:
    branches: [ new ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      ABI_FILTERS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Helium314/HeliBoard
          # Checkout the branch being built, not always main
          ref: main
      - name: Enable Gradle caching
        run: |
          echo "org.gradle.caching=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configuration-cache=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configureondemand=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configuration-cache.encryption=false" >> ${{ github.workspace }}/gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
         cache-disabled: false
         cache-overwrite-existing: true
         cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
    #  - name: Filter
    #    run: sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters 'arm64-v8a'/" app/build.gradle
        
      - name: Build with Gradle
        run: ./gradlew assembleRelease --build-cache --configuration-cache -PABI_FILTERS="${ABI_FILTERS}"

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@2.7.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/release/*.apk
          tag: Heli
          overwrite: true
          file_glob: true
          
      - name: Archive reports for failed job
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
