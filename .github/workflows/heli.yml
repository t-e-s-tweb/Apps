name: Heliboard

on:
  workflow_dispatch:
    inputs:
      merge_prs_heli:
        description: 'Comma-separated PR numbers to merge into heli app (0 = none)'
        required: false
        default: '0'


jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ABI_FILTERS: arm64-v8a
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Helium314/HeliBoard
          # Checkout the branch being built, not always main
          ref: main
          submodules: 'recursive'
          fetch-depth: '0'
     # - name: Enable Gradle caching
     #   run: |
      #    echo "org.gradle.caching=true" >> ${{ github.workspace }}/gradle.properties
      #    echo "org.gradle.configuration-cache=true" >> ${{ github.workspace }}/gradle.properties
      #    echo "org.gradle.configureondemand=true" >> ${{ github.workspace }}/gradle.properties
        #  echo "org.gradle.configuration-cache.encryption=false" >> ${{ github.workspace }}/gradle.properties

      
      - name: Copy only changed files from selected PRs into Heli
        if: ${{ github.event.inputs.merge_prs_heli != '0' }}
        run: |
         cd ${{ github.workspace }}/
         git config user.name "github-actions[bot]"
         git config user.email "github-actions[bot]@users.noreply.github.com"

         IFS=',' read -ra PR_LIST <<< "${{ github.event.inputs.merge_prs_heli }}"
         for PR_NUM in "${PR_LIST[@]}"; do
          echo "Fetching PR #$PR_NUM from 2dust/v2rayNG..."
          git fetch origin pull/$PR_NUM/head:pr-$PR_NUM
          echo "Merging PR #$PR_NUM with auto-resolve (theirs)..."
          git merge -X theirs --no-edit pr-$PR_NUM || true
          echo "Changes from PR #$PR_NUM:"
          git log HEAD~1..HEAD --stat || true
         done      
            
  
           
          
        
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
         cache-disabled: true
         cache-overwrite-existing: true
         cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
    
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
    #  - name: Filter
    #    run: sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters 'arm64-v8a'/" app/build.gradle
        
      - name: Build with Gradle
        run: ./gradlew assembleRelease -PABI_FILTERS="${ABI_FILTERS}"

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@2.7.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/release/*.apk
          tag: Heli
          overwrite: true
          file_glob: true
          
      - name: Archive reports for failed job
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
