name: MPVEx

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ABI_FILTERS: arm64-v8a
    outputs:
      commit_count: ${{ steps.set_commit.outputs.commit_count }}
      build_time: ${{ steps.set_commit.outputs.build_time }}
      arm64-v8a_size: ${{ steps.set_commit.outputs.arm64-v8a_size }}
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: marlboro-advance/mpvEx
          ref: master
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
      - name: Enable Gradle caching
        run: |
          echo "" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.caching=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configuration-cache=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configureondemand=true" >> /home/runner/work/Apps/Apps/gradle.properties
          echo "org.gradle.configuration-cache.encryption=false" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.unsafe.configuration-cache-problems=warn" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.daemon=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.parallel=true" >> ${{ github.workspace }}/gradle.propertie
          sed -i -e '$a\' ${{ github.workspace }}/gradle.properties
          echo "android.lint.abortOnError=false" >> ${{ github.workspace }}/gradle.properties
          echo "android.lint.checkReleaseBuilds=false" >> ${{ github.workspace }}/gradle.properties

      - name: armv8
        run: |
          sed -i 's/val volumeGestureSens = 0\.017f/val volumeGestureSens = 0.3f/' \
          app/src/main/java/app/marlboroadvance/mpvex/ui/player/controls/GestureHandler.kt
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
         cache-disabled: false
         cache-overwrite-existing: true
         cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
         ./gradlew tasks --all | grep -E 'assemble|lint|abi'
         ./gradlew assembleStandardPreview -x lint -x lintAnalyzeStandardPreviewUnitTest -x lintAnalyzeStandardPreview -x lintStandardPreview -x lintVitalStandardPreview -x updateLintBaseline --build-cache --configuration-cache


      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mpvEx
          name: mpvEx
          prerelease: false
          draft: false
          files: "**/*.apk"
      
