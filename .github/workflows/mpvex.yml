name: MPVEx

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ABI_FILTERS: arm64-v8a
    outputs:
      commit_count: ${{ steps.set_commit.outputs.commit_count }}
      build_time: ${{ steps.set_commit.outputs.build_time }}
      arm64-v8a_size: ${{ steps.set_commit.outputs.arm64-v8a_size }}
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: marlboro-advance/mpvEx
          ref: master
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
      - name: Enable Gradle caching
        run: |
          echo "" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.caching=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configuration-cache=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configureondemand=true" >> /home/runner/work/Apps/Apps/gradle.properties
          echo "org.gradle.configuration-cache.encryption=false" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.unsafe.configuration-cache-problems=warn" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.daemon=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.parallel=true" >> ${{ github.workspace }}/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
         cache-disabled: false
         cache-overwrite-existing: true
         cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assemblePreview --build-cache --configuration-cache -PABI_FILTERS="${ABI_FILTERS}"


      
      - name: Copy build artifacts
        id: set_commit
        run: |
          set -e
          commit_count=$(git rev-list --count HEAD)
          build_time=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "commit_count=$commit_count" >> $GITHUB_OUTPUT
          echo "build_time=$build_time" >> $GITHUB_OUTPUT

          declare -a apks=("arm64-v8a")
          mkdir -p output
          # Initialize empty array for file sizes
          declare -a file_sizes=()
          
          for arch in "${apks[@]}"; do
            src="app/build/outputs/apk/preview/*.apk"
            dest="output/mpvEx-preview-r${commit_count}-${arch}.apk"
            cp "$src" "$dest"
            
            # Get file size in human-readable format
            size=$(du -h "$dest" | cut -f1)
            echo "${arch}_size=$size" >> $GITHUB_OUTPUT
          done

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-apks
          path: output/
