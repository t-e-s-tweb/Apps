name: MPVEx

permissions:
  contents: write
  pages: write
  id-token: write

on:
  workflow_dispatch: # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit_count: ${{ steps.set_commit.outputs.commit_count }}
      build_time: ${{ steps.set_commit.outputs.build_time }}
      arm64-v8a_size: ${{ steps.set_commit.outputs.arm64-v8a_size }}
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          repository: marlboro-advance/mpvEx
          ref: master
          fetch-depth: 0
      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
           swap-size-gb: 10
      - name: Boostrap Gradle Memory
        shell: bash
        run: |
         wget https://raw.githubusercontent.com/PaulWoitaschek/Voice/refs/heads/main/scripts/gradle_bootstrap.sh
         chmod +x gradle_bootstrap.sh
         bash gradle_bootstrap.sh
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: 17
          cache: gradle
      - name: Enable Gradle caching
        run: |
          echo "" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.caching=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configuration-cache=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.configureondemand=true" >> /home/runner/work/Apps/Apps/gradle.properties
          echo "org.gradle.configuration-cache.encryption=false" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.unsafe.configuration-cache-problems=warn" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.daemon=true" >> ${{ github.workspace }}/gradle.properties
          echo "org.gradle.parallel=true" >> ${{ github.workspace }}/gradle.propertie
          sed -i -e '$a\' ${{ github.workspace }}/gradle.properties
          echo "android.lint.abortOnError=false" >> ${{ github.workspace }}/gradle.properties
          echo "android.lint.checkReleaseBuilds=false" >> ${{ github.workspace }}/gradle.properties

      - name: armv8
        run: |
          sed -i 's/val volumeGestureSens = 0\.017f/val volumeGestureSens = 0.3f/' \
          app/src/main/java/app/marlboroadvance/mpvex/ui/player/controls/GestureHandler.kt

          sed -i.bak '/ndk {/,/}/d' app/build.gradle.kts

          sed -i.bak -E \
          -e 's/include\([^)]+\)/include("arm64-v8a")/' \
          -e 's/isUniversalApk\s*=\s*true/isUniversalApk = false/' \
          app/build.gradle.kts
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
         cache-disabled: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: |
         ./gradlew clean assembleStandardPreview --refresh-dependencies --no-daemon -x check $(./gradlew tasks --all --quiet 2>/dev/null | awk '/lint|test|Test/{gsub(/.*:/,""); print "-x " $1}' | tr '\n' ' ')


      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mpvEx
          name: mpvEx
          prerelease: false
          draft: false
          files: "**/*.apk"
      
