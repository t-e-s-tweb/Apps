name: Build flux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flutter-version: [3.22.2]

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
          repository: mu-fazil-vk/FluxTube
          ref: invidious
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
       java-version: '17'
       distribution: 'temurin' # Options: adopt, zulu, temurin, etc.
    # Set up Flutter
    - name: Set up Flutter ${{ matrix.flutter-version }}
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ matrix.flutter-version }}

    # Install dependencies
    - name: Install dependencies
      run: flutter pub get

    # Run build_runner for Isar & Bloc
    - name: Run build_runner
      run: flutter pub run build_runner build --delete-conflicting-outputs
    - name: remove sign
      run : sed -i "/signingConfig signingConfigs.release/d" android/app/build.gradle
    # Build the Flutter app
    - name: Build APK
      run: flutter build apk --release

    # Optionally, store the APK as an artifact
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/*.apk
