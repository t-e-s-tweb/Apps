name: Build flux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        flutter-version: [3.22.2]

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
          repository: mu-fazil-vk/FluxTube
          ref: major-fixes


    - name: edit
      run: |
        sed -i \
        -e "s|https://inv.nadeko.net|https://echostreamz.com|g" \
        -e "s|https://api.invidious.io/instances.json|https://raw.githubusercontent.com/n-ce/Uma/refs/heads/main/iv.json|g" \
        lib/core/strings.dart
        grep -n "echostreamz\|iv.json" lib/core/strings.dart
    
    
    
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
       java-version: '17'
       distribution: 'temurin' # Options: adopt, zulu, temurin, etc.
    # Set up Flutter
    - name: Set up Flutter ${{ matrix.flutter-version }}
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    # Install dependencies
    - name: Install dependencies
      run: flutter pub get

    # Run build_runner for Isar & Bloc
    - name: Run build_runner
      run: flutter pub run build_runner build --delete-conflicting-outputs
    - name: remove sign
      run : sed -i "/signingConfig signingConfigs.release/d" android/app/build.gradle
    # Build the Flutter app
    - name: Build APK
      run: flutter build apk --release
    
    
    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@2.7.0
      with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/build/app/outputs/flutter-apk/*.apk
          tag: flux
          overwrite: true
          file_glob: true
   
