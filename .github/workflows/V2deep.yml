name: Build v2new

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: 2dust/v2rayNG
        ref: master
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Prepare build environment
      run: |
        mkdir -p ${{ github.workspace }}/build
        mkdir -p ${{ github.workspace }}/V2rayNG/app/libs

    - name: Fetch AndroidLibXrayLite
      run: |
        cd ${{ github.workspace }}/build
        git clone --depth=1 -b main https://github.com/2dust/AndroidLibXrayLite.git
        cd AndroidLibXrayLite
        git submodule update --init

    - name: Cache dependencies
      id: cache-deps
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/AndroidLibXrayLite/libs
          ${{ github.workspace }}/build/AndroidLibXrayLite/
          ${{ github.workspace }}/hysteria/libs
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/build-cache
          ${{ github.workspace }}/V2rayNG/.gradle
        key: deps-${{ runner.os }}-${{ hashFiles('.git/modules/**/HEAD', '**/*.gradle*', '**/gradle-wrapper.properties', 'libhysteria2.sh') }}
        restore-keys: |
          deps-${{ runner.os }}-

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r27
        add-to-path: true
        link-to-sdk: true
        local-cache: true

    - name: Build libtun2socks
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        cd ${{ github.workspace }}/build/AndroidLibXrayLite
        bash compile-tun2socks.sh
        tar -xvzf libtun2socks.so.tgz
      env:
        NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Setup Golang
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true
        cache-dependency-path: ${{ github.workspace }}/build/AndroidLibXrayLite/go.sum

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$HOME/go/bin" >> $GITHUB_PATH

    - name: Build libv2ray
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        cd ${{ github.workspace }}/build/AndroidLibXrayLite
        go get github.com/xtls/xray-core@main || true
        gomobile init
        go mod tidy
        gomobile bind -v -androidapi 21 -trimpath -ldflags='-s -w -buildid=' ./
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Build libhysteria2
      if: steps.cache-deps.outputs.cache-hit != 'true'
      run: |
        bash libhysteria2.sh
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Copy libraries to V2rayNG
      run: |
        cp -r ${{ github.workspace }}/AndroidLibXrayLite/libs/* ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/build/AndroidLibXrayLite/*.aar ${{ github.workspace }}/V2rayNG/app/libs/
        cp -r ${{ github.workspace }}/hysteria/libs/* ${{ github.workspace }}/V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android environment
      uses: android-actions/setup-android@v3

    - name: Build APK with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        arguments: assembleRelease --parallel --build-cache --configure-on-demand --max-workers=4
        cache-read-only: ${{ steps.cache-deps.outputs.cache-hit == 'true' }}

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@2.7.0
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*playstore*/release/*.apk
        tag: v2
        overwrite: true
        file_glob: true
