name: libre

on:
  workflow_dispatch:
  push:
    branches: [ new ]
  pull_request:
    branches: [ new ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          repository: libre-tube/LibreTube
          ref: master
          

      - name: ADD
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .  
      
