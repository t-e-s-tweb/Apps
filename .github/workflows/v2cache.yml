name: Build v2cache

on:
  workflow_dispatch:
    inputs:
      XRAY_CORE_VERSION:
        description: 'Xray core version or commit hash'
        required: false
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: 2dust/v2rayNG
        ref: master

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create empty go.sum if it does not exist
      run: |
        if [ ! -f go.sum ]; then
          touch go.sum
        fi

    - name: Setup Golang
      uses: actions/setup-go@v5
      with:
        go-version: '1.22.2'
        cache: false

    # Cache Go modules
    - name: Cache Go modules
      id: cache-go-mod
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Setup Android environment
      uses: android-actions/setup-android@v3

    # Cache AndroidLibXrayLite repository
    - name: Cache AndroidLibXrayLite
      id: cache-androidlibxraylite
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/build/AndroidLibXrayLite
        key: ${{ runner.os }}-androidlibxraylite-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-androidlibxraylite-

    - name: Build dependencies
      run: |
        mkdir -p ${{ github.workspace }}/build
        cd ${{ github.workspace }}/build
        if [ ! -d AndroidLibXrayLite ]; then
          git clone --depth=1 -b main https://github.com/2dust/AndroidLibXrayLite.git
        fi
        cd AndroidLibXrayLite
        go get github.com/xtls/xray-core@main || true
        gomobile init
        go mod tidy -v
        gomobile bind -v -androidapi 21 -ldflags='-s -w' ./
        cp *.aar ${{ github.workspace }}/V2rayNG/app/libs/

    - name: Cache Gradle dependencies
      id: cache-gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ${{ github.workspace }}/V2rayNG/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        chmod 755 gradlew
        ./gradlew assembleRelease --build-cache --parallel

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@2.7.0
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/release/*.apk
        tag: v2
        overwrite: true
        file_glob: true
