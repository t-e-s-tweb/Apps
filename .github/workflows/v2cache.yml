name: Build v2cache

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

    - name: Setup Android environment
      uses: android-actions/setup-android@v3

    # Cache AndroidLibXrayLite repository
    - name: Cache AndroidLibXrayLite
      id: cache-androidlibxraylite
      uses: actions/cache@v3
      with:
        path: ${{ github.workspace }}/build/AndroidLibXrayLite
        key: ${{ runner.os }}-androidlibxraylite-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-androidlibxraylite-

    - name: Build dependencies
      run: |
        mkdir -p ${{ github.workspace }}/build
        cd ${{ github.workspace }}/build
        if [ ! -d AndroidLibXrayLite ]; then
          git clone --depth=1 -b main https://github.com/2dust/AndroidLibXrayLite.git
        fi
        cd AndroidLibXrayLite
        if [ -z "${{ github.event.inputs.XRAY_CORE_VERSION }}" ]; then
         go get github.com/xtls/xray-core@main || true
        else
         go get github.com/xtls/xray-core@${{ github.event.inputs.XRAY_CORE_VERSION }} || true
        fi
        gomobile init
        go mod tidy -v
        gomobile bind -v -androidapi 21 -ldflags='-s -w' ./
        cp *.aar ${{ github.workspace }}/V2rayNG/app/libs/

    - name: Cache Gradle dependencies
      id: cache-gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ${{ github.workspace }}/V2rayNG/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    
    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        git revert c61595eb0d5c9feb9559ed9f22c150bd2a1aa80d --no-edit
        chmod 755 gradlew
        ./gradlew assembleRelease --build-cache --parallel

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@2.7.0
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/release/*.apk
        tag: v2
        overwrite: true
        file_glob: true
