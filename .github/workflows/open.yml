name: Heliboard

on:
  workflow_dispatch:
  push:
    branches: [ new ]
  pull_request:
    branches: [ new ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: Helium314/HeliBoard
          ref: main
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Enable Gradle build caching
        run: |
         echo "org.gradle.caching=true" >> gradle.properties   
      - name: Cache Gradle dependencies
        id: cache-gradle
        uses: actions/cache@v4
        with:
         path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
         key: gradle-${{ runner.os }}-heli-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
         restore-keys: |
          gradle-${{ runner.os }}-heli-


      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Filter
        run: sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'/abiFilters 'arm64-v8a'/" app/build.gradle
      - name: Build with Gradle
        run: ./gradlew assembleRelease --warning-mode none

  #    - name: Upload APK
    #    uses: actions/upload-artifact@v4
   #     with:
  #        name: OpenBoard-debug
   #       path: app/build/outputs/apk/release/*.apk
      
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@2.7.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/release/*.apk
          tag: Heli
          overwrite: true
          file_glob: true
      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
